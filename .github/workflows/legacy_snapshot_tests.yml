name: vHive legacy snapshot tests

on:
  push:
    branches: [ firecracker-v1.18-containerdv2-integration ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ firecracker-v1.18-containerdv2-integration ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-snapshot:
    name: Legacy snapshot continuity (File memory)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FICD_DM_POOL: vhive-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - name: Select private build and evidence paths
        run: |
          echo "STACK_DIR=$RUNNER_TEMP/vhive-firecracker-stack" >> "$GITHUB_ENV"
          echo "INSTALL_DIR=$RUNNER_TEMP/vhive-firecracker-install" >> "$GITHUB_ENV"
          echo "VHIVE_CI_EVIDENCE=$RUNNER_TEMP/vhive-legacy-snapshot" >> "$GITHUB_ENV"

      - name: Check KVM access
        run: sudo -n test -r /dev/kvm && sudo -n test -w /dev/kvm

      - name: Reclaim build space
        run: scripts/github_runner/gh-actions-disk-cleanup.sh

      - name: Provision build prerequisites preserving hosted Docker
        run: |
          python3 -m unittest discover -s scripts/github_runner/tests -v
          mkdir -p "$VHIVE_CI_EVIDENCE"
          bash scripts/github_runner/prepare_legacy_snapshot.sh 2>&1 | tee "$VHIVE_CI_EVIDENCE/prerequisites.log"

      - name: Install verified stack and test legacy snapshot continuity
        run: bash scripts/github_runner/test_legacy_snapshot.sh

      - name: Preserve installation and acceptance provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vhive-legacy-snapshot
