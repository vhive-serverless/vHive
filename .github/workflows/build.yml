name: vHive build tests

on:
  push:
    branches: [ main, legacy-firecracker-v0.24.0-with-upf-support, firecracker-v1.18-containerdv2-integration ]
    paths-ignore:
    - 'docs/**'
    - '**.md'
  pull_request:
    branches: [ main, legacy-firecracker-v0.24.0-with-upf-support, firecracker-v1.18-containerdv2-integration ]
    paths-ignore:
    - 'docs/**'
    - '**.md'
  workflow_dispatch:

env:
  GOOS: linux
  GO111MODULE: on

jobs:

  build:
    strategy:
      matrix:
        go: ['1.26.11']
      # Build all variants regardless of failures
      fail-fast: false

    name: Build and check code quality
    runs-on: ubuntu-24.04
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
      with:
        # to add commit DCO checks later
        fetch-depth: 21

    - name: Set up Go ${{ matrix.go }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}

    - name: Check code
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        args: --timeout 5m

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -mod=readonly -race -v -a ./...
