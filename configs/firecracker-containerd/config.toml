version = 4
disabled_plugins = ["io.containerd.cri.v1.images", "io.containerd.cri.v1.runtime"]
root = "/var/lib/firecracker-containerd/containerd"
state = "/run/firecracker-containerd"

[plugins."io.containerd.server.v1.grpc"]
  address = "/run/firecracker-containerd/containerd.sock"

[plugins."io.containerd.server.v1.ttrpc"]
  address = "/run/firecracker-containerd/containerd.sock.ttrpc"

[proxy_plugins.proxy]
  type = "snapshot"
  address = "/var/lib/demux-snapshotter/snapshotter.sock"

[plugins."io.containerd.snapshotter.v1.devmapper"]
  pool_name = "fc-dev-thinpool"
  base_image_size = "10GB"
  root_path = "/var/lib/firecracker-containerd/snapshotter/devmapper"

[debug]
  level = "debug"
